# Serves the prerendered site. Mirrors static/_headers, which only applies
# on Netlify/Cloudflare — here the headers are real, and unlike GitHub Pages
# that includes clickjacking protection.

# Hashed bundle files can be cached forever; images change on redeploys, so
# they get a day; HTML always revalidates so a deploy is visible immediately.
map $uri $aifb_cache_control {
    default            "no-cache";
    ~^/_app/immutable/ "public, max-age=31536000, immutable";
    ~^/images/         "public, max-age=86400";
}

server {
    # The unprivileged nginx image runs as uid 101 and cannot bind port 80.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Do not advertise the nginx version on responses or error pages.
    server_tokens off;

    # Keep redirects relative so they survive a reverse proxy that
    # terminates TLS on a different host and port.
    absolute_redirect off;

    add_header Cache-Control $aifb_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml;

    location / {
        # The site is built with trailingSlash: 'always', so send /about-us
        # to /about-us/ rather than serving the same page at two URLs.
        if (-d $document_root$uri) {
            rewrite ^(.*[^/])$ $1/ permanent;
        }
        try_files $uri $uri/index.html =404;
    }

    # Deployment metadata that should never be served to visitors.
    location ~ ^/(_headers|\.nojekyll)$ {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
